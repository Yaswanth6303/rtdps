spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false                  # H2 in-memory; JPA creates schema for the context test

  batch:
    jdbc:
      initialize-schema: ALWAYS     # batch metadata tables on H2 for context loads
    job:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  upload-dir: ${java.io.tmpdir}/rtdps-uploads-test
