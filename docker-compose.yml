services:
  app:
    profiles: ["production"]
    build: .
    container_name: rtdps-app
    ports:
      - "9191:9191"
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/rtdps
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - API_USER=admin
      - API_PASSWORD=admin
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports

  postgres:
    image: postgres:17
    container_name: rtdps-postgres
    environment:
      POSTGRES_DB: rtdps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.1
    container_name: rtdps-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Listeners - CONTROLLER is internal only
      # Expose two ports: 9092 for internal Docker network, 29092 for the host Mac
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single node defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

volumes:
  postgres_data: