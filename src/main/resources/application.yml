spring:
  datasource:
    # Defaults match docker-compose.yml so `podman compose up postgres` + `./gradlew bootRun` just works.
    url:      ${POSTGRES_URL:jdbc:postgresql://localhost:5432/rtdps}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; JPA only validates mappings
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never # Flyway V1 owns the BATCH_* tables
    job:
      enabled: false # jobs are launched by Kafka consumer, never on boot

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  kafka:
    # 29092 is the EXTERNAL listener exposed to the host machine.
    # From inside the compose network, override with KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: rtdps-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns unparseable payloads into a DeserializationException
      # the DefaultErrorHandler can route to the DLT, instead of failing inside poll().
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "me.yswnthdev.rtdps.dto"

server:
  port: 9191

app:
  upload-dir: ${user.dir}/uploads
